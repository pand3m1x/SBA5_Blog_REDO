<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="containers">
    <div id="left-container">
        <h2>🍓Hey Nana...🍓</h2>
        <div class="input-container">
            <input type="text" id="title" placeholder="♫ Place a title ♪" required>
            <textarea id="content" rows="5" placeholder="♬ Write your day and observations here ♫" required></textarea>
            <button id="postButton">Post</button>
            <!-- <p id="signature" style="text-align: right;"><i>--Hachi</i></p> should be at end of each post -->
        </div>
    </div>
    <div id="right-container">
        <div class="posts-container" id="posts"></div>
    </div>
    
</div>
 <div class="music-player">
        <p class="now-playing">
            ♫ Currently listening to...
        </p>
        <iframe
            width="100%"
            height="150"
            src="https://www.youtube.com/embed/qRkv3gPPRME"
            title="NANA Acoustic Cover"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
        </iframe>
    </div>
    <script src="script.js"></script>
</body>
</html>
